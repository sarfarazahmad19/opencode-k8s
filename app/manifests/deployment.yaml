apiVersion: v1
kind: Namespace
metadata:
  name: traefik-poller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-poller
  namespace: traefik-poller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-poller
  namespace: flux-system
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-poller
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: traefik-poller
    namespace: traefik-poller
roleRef:
  kind: Role
  name: traefik-poller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-poller-config
  namespace: traefik-poller
data:
  config.yaml: |
    github_token: ""
    repo: "sarfarazahmad19/opencode-k8s"
    label: "traefik"
    flux_namespace: "flux-system"
    gitrepo_name: "flux-system"
    test_namespace: "flux-system"
    poll_interval: 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-poller
  namespace: traefik-poller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik-poller
  template:
    metadata:
      labels:
        app: traefik-poller
    spec:
      serviceAccountName: traefik-poller
      containers:
        - name: poller
          image: python:3.11-slim
          command:
            - python
            - /app/main.py
          workingDir: /app
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
          volumeMounts:
            - name: app
              mountPath: /app
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: app
          emptyDir: {}
        - name: config
          configMap:
            name: traefik-poller-config
