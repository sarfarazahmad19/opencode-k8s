name: Update Traefik Helm Chart Version

on:
  workflow_dispatch:

scms:
  github:
    kind: github
    spec:
      owner: sarfarazahmad19
      repository: opencode-k8s
      branch: main
      user: sarfarazahmad19
      email: sarfarazahmad19@gmail.com
      token: '{{ .github.token }}'

scmid:
  github:
    scm: github
    branch: main
    commitmessage: Update Traefik Helm Chart to {{ source "traefik" }}
    pullRequest:
      title: 'Update Traefik Helm Chart to {{ source "traefik" }}'
      body: 'Updatecli found a new version of traefik helm chart. Please review and merge.'
      labels:
        - traefik
        - dependencies

sources:
  traefik:
    kind: helmchart
    spec:
      name: traefik
      url: https://traefik.github.io/charts
      versionfilter:
        kind: semver
        pattern: "39.*"

targets:
  update-helmrelease:
    name: Update Traefik HelmRelease
    kind: yaml
    spec:
      file: flux/HelmRelease.yaml
      key: $.spec.chart.spec.version
    source: traefik
    scmid: github
