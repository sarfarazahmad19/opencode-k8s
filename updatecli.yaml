name: Update Traefik Helm Chart Version

on:
  workflow_dispatch:

scms:
  github:
    kind: github
    spec:
      owner: sarfarazahmad19
      repository: opencode-k8s
      branch: main
      user: sarfarazahmad19
      email: sarfarazahmad19@gmail.com
      token: '{{ .github.token }}'

sources:
  traefik:
    kind: helmchart
    spec:
      name: traefik/traefik
      url: https://traefik.github.io/charts
      versionfilter:
        kind: semver
        pattern: "v39.*"

targets:
  update-helmrelease:
    name: Update Traefik HelmRelease
    kind: yaml
    spec:
      file: flux/HelmRelease.yaml
      key: $.spec.chart.spec.version
