name: Poller

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Install deps
        working-directory: app
        run: uv sync

      - name: Run poller
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python main.py --no-dry-run --run-once